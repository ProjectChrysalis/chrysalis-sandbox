name: release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build:python
      - run: bun run test
      - run: bun run pack
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            sandbox-*.zip
            SHA256SUMS
